# KubeArbiter 执行侧：worker 从 tasks 表领取已审批任务，dry-run 通过后写集群。
# 与 arbiter-api 共享 PostgreSQL 任务表；集群写入仅限 Deployment / StatefulSet。
# 应用清单：kubectl apply -f deploy/arbiter/worker.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arbiter-worker
  namespace: kubearbiter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arbiter-worker-exec
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arbiter-worker-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arbiter-worker-exec
subjects:
  - kind: ServiceAccount
    name: arbiter-worker
    namespace: kubearbiter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter-worker
  namespace: kubearbiter
  labels:
    app: arbiter-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arbiter-worker
  template:
    metadata:
      labels:
        app: arbiter-worker
    spec:
      serviceAccountName: arbiter-worker
      # 与 arbiter-api 一致：应用镜像仅在控制平面节点导入。
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: arbiter-worker
          image: kubearbiter/arbiter-worker:0.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: ARBITER_PG_DSN
              value: postgres://kubearbiter@postgres.kubearbiter.svc:5432/kubearbiter?sslmode=disable
            - name: ARBITER_WORKER_METRICS_ADDR
              value: ":9101"
            - name: ARBITER_WORKER_CONCURRENCY
              value: "2"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
